# Met à jour les prix (data/prix.json) et publie le site sur GitHub Pages.
# - toutes les 20 minutes pendant les heures de bourse (lundi au vendredi), pour laisser de la place
#   aux titres ajoutés dans suivis.json sans dépasser 800 crédits par jour chez Twelve Data;
# - une fois après la fermeture, avec l'historique quotidien complet;
# - à chaque modification poussée sur main, et à la main (onglet Actions).
name: Données et publication

on:
  schedule:
    - cron: '*/20 13-21 * * 1-5'
    - cron: '30 22 * * 1-5'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les prix
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FORCER_QUOTIDIEN: ${{ github.event.schedule == '30 22 * * 1-5' && '1' || '0' }}
        run: node scripts/recuperer-donnees.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
